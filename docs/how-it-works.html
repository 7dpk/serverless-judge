<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>How a submission runs</title>
<style>
:root {
  --page: #f9f9f7; --surface: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --faint: #d6d5cc; --axis: #c3c2b7;
  --blue: #2a78d6; --orange: #eb6834; --green: #0ca30c;
  --bluewash: #e6eff9; --orangewash: #fbeae2; --greenwash: #e2f3e2;
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8d86;
  --faint: #33332f; --axis: #4a4a45;
  --blue: #3987e5; --orange: #e0652f; --green: #18b318;
  --bluewash: #14263c; --orangewash: #3a2015; --greenwash: #12301a;
}
html, body { margin: 0; background: var(--page); }
svg { display: block; font-family: -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<svg id="s" width="960" height="540" viewBox="0 0 960 540"></svg>
<script>
// Five slow steps, one idea each. draw(t) renders the frame at t seconds, so
// docs/render.js can make the GIF frame by frame and take one still per step.
//
//   how-it-works.html            plays it
//   how-it-works.html?step=3     the still for step 3
//   ...&theme=dark               dark colours
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

// Each step: when it starts and ends, the moment used for its still, and the
// two lines under the picture.
const STEPS = [
  { from: 0, to: 5, still: 4,
    title: 'Nobody is submitting',
    sub: 'Nothing is running, so there is no compute to pay for.' },
  { from: 5, to: 12, still: 11,
    title: 'A submission arrives',
    sub: 'The API and the runner for that language start on demand.' },
  { from: 12, to: 20.5, still: 15.4,
    title: 'It runs in its own sandbox',
    sub: 'No network, 2 s of CPU, 256 MB. One run, then the sandbox is destroyed.' },
  { from: 20.5, to: 32, still: 25,
    title: 'A burst is queued',
    sub: 'Every submission gets a token at once. Runners scale out and work through the queue.' },
  { from: 32, to: 38, still: 37,
    title: 'Traffic stops',
    sub: 'Billing stopped with the last request. Idle instances shut down within 15 minutes.' },
];
const DURATION = STEPS[STEPS.length - 1].to;
window.DURATION = DURATION;
window.STILLS = STEPS.map(s => s.still);

// When things happen, in seconds.
const T = {
  in0: 5.8, apiUp: 7.0, runnerUp: 8.4,           // step 2: the request travels in
  box0: 12.6, run0: 13.4, run1: 16.4,            // step 3: sandbox created, code runs
  gone0: 17.6, back0: 17.2, back1: 18.2, out1: 19.1,
  runnerDown: 33.2, apiDown: 34.2,               // step 5
};

// Step 4: six submissions, up to four runner instances.
const N = 6;
const DISPATCH = [23.2, 23.7, 24.2, 24.7, 25.8, 26.3];
const J = DISPATCH.map((d, i) => {
  const tin = 21.2 + 0.4 * i;
  return { i, tin, api: tin + 0.8, q: tin + 1.5, d, tile: i % 4, run0: d + 0.7, run1: d + 2.5 };
});
const LAST = Math.max(...J.map(j => j.run1));

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const within = (t, a, b) => t >= a && t < b;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function pathOf(pts) {
  const segs = []; let L = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push([pts[i - 1], pts[i], l]); L += l;
  }
  return { pts, segs, L };
}
function at(path, p) {
  let d = clamp(p) * path.L;
  for (const [a, b, l] of path.segs) {
    if (d <= l) return [a[0] + (b[0] - a[0]) * (l ? d / l : 0), a[1] + (b[1] - a[1]) * (l ? d / l : 0)];
    d -= l;
  }
  return path.pts[path.pts.length - 1];
}
const rev = path => pathOf(path.pts.slice().reverse());

// --- where things are ---------------------------------------------------------
const B = {
  client: { x: 40, y: 196, w: 150, h: 88, title: 'Your app', sub: 'sends the code' },
  api: { x: 286, y: 196, w: 170, h: 88, title: 'API', sub: 'checks key and limits' },
  queue: { x: 286, y: 372, w: 170, h: 76, title: 'Queue', sub: 'Pub/Sub and a worker' },
  runner: { x: 560, y: 112, w: 360, h: 256, title: 'Runner', sub: 'one service per language' },
};
const MID = 240;
const P = {
  in: pathOf([[190, MID], [286, MID]]),
  top: pathOf([[456, MID], [560, MID]]),
  down: pathOf([[371, 284], [371, 372]]),
  up: pathOf([[456, 410], [508, 410], [508, 316], [560, 316]]),
};
const SLOT = { x: 584, y: 190, w: 312, h: 150 };
const TILE = [0, 1, 2, 3].map(i => ({ x: 584 + (i % 2) * 160, y: 190 + Math.floor(i / 2) * 78, w: 152, h: 70 }));

// --- drawing ------------------------------------------------------------------
let out = [];
const put = s => out.push(s);

function text(x, y, s, o = {}) {
  put(`<text x="${x}" y="${y}" font-size="${o.size || 13}" font-weight="${o.weight || 400}" fill="${o.fill || 'var(--ink2)'}" text-anchor="${o.anchor || 'start'}"${o.opacity != null ? ` opacity="${o.opacity}"` : ''}>${esc(s)}</text>`);
}
function pill(xRight, yMid, label, on) {
  const w = label.length * 7.2 + 20, h = 22;
  put(`<rect x="${xRight - w}" y="${yMid - h / 2}" width="${w}" height="${h}" rx="11" fill="${on ? 'var(--blue)' : 'var(--page)'}" stroke="${on ? 'var(--blue)' : 'var(--axis)'}"/>`);
  text(xRight - w / 2, yMid + 4.5, label, { size: 13, weight: 600, anchor: 'middle', fill: on ? '#ffffff' : 'var(--muted)' });
}
const instances = n => (n === 1 ? '1 instance' : `${n} instances`);
function box(b, awake, o = {}) {
  put(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="12" fill="${awake ? 'var(--surface)' : 'var(--page)'}" stroke="${awake ? (o.plain ? 'var(--ink2)' : 'var(--blue)') : 'var(--axis)'}" stroke-width="${awake ? 2 : 1.25}"${awake ? '' : ' stroke-dasharray="6 5"'}/>`);
  text(b.x + 16, b.y + 34, b.title, { size: 18, weight: 650, fill: awake ? 'var(--ink)' : 'var(--muted)' });
  if (o.sub !== null) text(b.x + 16, b.y + 56, o.sub || b.sub, { size: 13, fill: awake ? 'var(--ink2)' : 'var(--muted)' });
  if (o.count != null) pill(b.x + b.w - 12, b.y, instances(o.count), o.count > 0);
}
function edge(path, on) {
  const d = path.pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  put(`<path d="${d}" fill="none" stroke="${on ? 'var(--ink2)' : 'var(--faint)'}" stroke-width="1.75" marker-end="url(#${on ? 'arrOn' : 'arrOff'})"/>`);
}
function dot(pos, color, r = 8) {
  put(`<circle cx="${pos[0].toFixed(1)}" cy="${pos[1].toFixed(1)}" r="${r}" fill="var(--${color})" stroke="var(--page)" stroke-width="2.5"/>`);
}
function travel(t, path, a, b, color) {
  if (within(t, a, b)) dot(at(path, ease(prog(t, a, b))), color);
}
function check(cx, cy, r) {
  put(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--green)"/>`);
  put(`<path d="M${cx - r * 0.45} ${cy + r * 0.05} l${r * 0.3} ${r * 0.32} l${r * 0.62} ${-r * 0.7}" fill="none" stroke="#ffffff" stroke-width="${Math.max(1.8, r * 0.2)}" stroke-linecap="round" stroke-linejoin="round"/>`);
}
function chip(b, label, good) {
  const y = b.y + b.h + 12;
  put(`<rect x="${b.x}" y="${y}" width="${b.w}" height="32" rx="16" fill="${good ? 'var(--greenwash)' : 'var(--bluewash)'}" stroke="${good ? 'var(--green)' : 'var(--blue)'}" stroke-width="1.5"/>`);
  if (good) check(b.x + 20, y + 16, 9);
  text(b.x + (good ? 36 : b.w / 2), y + 21, label, { size: 14, weight: 600, anchor: good ? 'start' : 'middle', fill: 'var(--ink)' });
}
function code(cx, cy, stroke) {
  put(`<rect x="${cx - 56}" y="${cy - 17}" width="112" height="34" rx="8" fill="var(--surface)" stroke="${stroke}" stroke-width="1.5"/>`);
  text(cx, cy + 5, 'your code', { size: 14, weight: 600, anchor: 'middle', fill: 'var(--ink)' });
}

// Steps 2 and 3: the one sandbox.
function sandbox(t) {
  const g = SLOT, cx = g.x + g.w / 2;
  const frame = (stroke, fill, dash, opacity = 1) =>
    put(`<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${dash ? 1.25 : 2}"${dash ? ' stroke-dasharray="5 5"' : ''} opacity="${opacity.toFixed(2)}"/>`);
  if (t < T.runnerUp) {
    text(cx, g.y + 80, 'nothing running', { size: 14, anchor: 'middle', fill: 'var(--muted)' });
  } else if (t < T.box0) {
    frame('var(--faint)', 'none', true);
    code(cx, g.y + 62, 'var(--blue)');
    text(cx, g.y + 108, 'received', { size: 13, anchor: 'middle', fill: 'var(--muted)' });
  } else if (t < T.run0) {
    frame('var(--ink2)', 'var(--surface)', false, 0.3 + 0.7 * ease(prog(t, T.box0, T.run0)));
    text(g.x + 14, g.y + 24, 'sandbox', { size: 13, weight: 650, fill: 'var(--ink2)' });
    code(cx, g.y + 62, 'var(--blue)');
    text(cx, g.y + 108, 'creating a sandbox', { size: 13, anchor: 'middle', fill: 'var(--muted)' });
  } else if (t < T.run1) {
    frame('var(--orange)', 'var(--orangewash)', false);
    text(g.x + 14, g.y + 24, 'sandbox', { size: 13, weight: 650, fill: 'var(--orange)' });
    code(cx, g.y + 62, 'var(--orange)');
    put(`<rect x="${g.x + 40}" y="${g.y + 96}" width="${g.w - 80}" height="8" rx="4" fill="var(--faint)"/>`);
    put(`<rect x="${g.x + 40}" y="${g.y + 96}" width="${((g.w - 80) * prog(t, T.run0, T.run1)).toFixed(1)}" height="8" rx="4" fill="var(--orange)"/>`);
    text(cx, g.y + 130, 'compile, run, measure', { size: 13, anchor: 'middle' });
  } else if (t < T.gone0) {
    frame('var(--green)', 'var(--greenwash)', false);
    text(g.x + 14, g.y + 24, 'sandbox', { size: 13, weight: 650, fill: 'var(--green)' });
    check(cx, g.y + 66, 18);
    text(cx, g.y + 116, 'Accepted', { size: 15, weight: 650, anchor: 'middle', fill: 'var(--ink)' });
  } else {
    const o = 0.25 + 0.75 * ease(prog(t, T.gone0, T.gone0 + 0.6));
    frame('var(--muted)', 'none', true, o);
    put(`<path d="M${cx - 14} ${g.y + 44} l28 28 M${cx + 14} ${g.y + 44} l-28 28" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" opacity="${o.toFixed(2)}"/>`);
    text(cx, g.y + 108, 'sandbox destroyed', { size: 14, weight: 600, anchor: 'middle', fill: 'var(--muted)', opacity: o.toFixed(2) });
  }
}

// Steps 4 and 5: one tile per runner instance.
function tile(g, n, state, p) {
  if (state === 'off') {
    put(`<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="10" fill="none" stroke="var(--faint)" stroke-dasharray="4 5"/>`);
    return;
  }
  const run = state === 'running';
  put(`<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" rx="10" fill="${run ? 'var(--orangewash)' : 'var(--surface)'}" stroke="${run ? 'var(--orange)' : 'var(--ink2)'}" stroke-width="${run ? 2 : 1.25}"${run ? '' : ' stroke-dasharray="5 5"'}/>`);
  text(g.x + 12, g.y + 25, `instance ${n}`, { size: 13, weight: 650, fill: run ? 'var(--orange)' : 'var(--ink2)' });
  if (run) {
    put(`<rect x="${g.x + 12}" y="${g.y + 42}" width="${g.w - 24}" height="8" rx="4" fill="var(--faint)"/>`);
    put(`<rect x="${g.x + 12}" y="${g.y + 42}" width="${((g.w - 24) * p).toFixed(1)}" height="8" rx="4" fill="var(--orange)"/>`);
  } else {
    text(g.x + 12, g.y + 50, state, { size: 13, fill: 'var(--muted)' });
  }
}

function draw(t) {
  t = ((t % DURATION) + DURATION) % DURATION;
  const n = Math.max(0, STEPS.findIndex(s => within(t, s.from, s.to)));
  const step = STEPS[n];
  out = [];
  put(`<defs>
    <marker id="arrOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="var(--ink2)"/></marker>
    <marker id="arrOff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="var(--faint)"/></marker>
  </defs>`);
  put(`<rect x="0.5" y="0.5" width="959" height="539" rx="12" fill="var(--page)" stroke="var(--faint)"/>`);

  // header: what this is, and whether compute is being billed right now
  const billed = within(t, T.apiUp, T.out1) || within(t, J[0].api, LAST);
  text(40, 50, 'How a submission runs', { size: 17, weight: 650, fill: 'var(--ink)' });
  text(868, 50, 'compute billing', { size: 14, anchor: 'end' });
  pill(920, 45, billed ? 'on' : 'off', billed);

  const apiUp = within(t, T.apiUp, T.apiDown);
  const burst = t >= STEPS[3].from;
  const runners = t < T.runnerUp ? 0 : t < DISPATCH[1] ? 1 : t < DISPATCH[2] ? 2 : t < DISPATCH[3] ? 3 : t < T.runnerDown ? (burst ? 4 : 1) : 0;
  const direct = n === 1 || n === 2, queued = n === 3;

  edge(P.in, direct || queued);
  edge(P.top, direct);
  edge(P.down, queued);
  edge(P.up, queued);

  box(B.client, true, { plain: true });
  box(B.api, apiUp, { count: apiUp ? 1 : 0 });

  // the queue, and what is waiting in it
  const waiting = J.filter(j => within(t, j.q, j.d)).length;
  box(B.queue, queued, { plain: true, sub: waiting ? null : undefined });
  for (let k = 0; k < waiting; k++) put(`<circle cx="${B.queue.x + 24 + k * 20}" cy="${B.queue.y + 52}" r="7" fill="var(--blue)"/>`);

  // the runner, and what is inside it
  box(B.runner, runners > 0, { count: runners });
  if (!burst) {
    sandbox(t);
  } else if (runners === 0) {
    text(SLOT.x + SLOT.w / 2, SLOT.y + 80, 'nothing running', { size: 14, anchor: 'middle', fill: 'var(--muted)' });
  } else {
    for (let k = 0; k < 4; k++) {
      const mine = J.filter(j => j.tile === k);
      const born = k === 0 ? 0 : DISPATCH[k];
      let state = t < born ? 'off' : t < mine[0].run0 && k > 0 ? 'starting' : 'idle', p = 0;
      for (const j of mine) if (within(t, j.run0, j.run1)) { state = 'running'; p = prog(t, j.run0, j.run1); }
      tile(TILE[k], k + 1, state, p);
    }
  }

  // what the caller has in hand
  if (within(t, T.out1, STEPS[3].from)) chip(B.client, 'Accepted', true);
  if (burst && t < T.runnerDown) {
    const got = J.filter(j => t >= j.api).length, done = J.filter(j => t >= j.run1).length;
    if (done > 0) chip(B.client, `${done} of ${N} done`, done === N);
    else if (got > 0) chip(B.client, got === 1 ? '1 token' : `${got} tokens`, false);
  }

  // --- the moving parts -------------------------------------------------------
  travel(t, P.in, T.in0, T.apiUp, 'blue');
  travel(t, P.top, T.apiUp, T.runnerUp, 'blue');
  travel(t, rev(P.top), T.back0, T.back1, 'green');
  travel(t, rev(P.in), T.back1, T.out1, 'green');
  for (const j of J) {
    travel(t, P.in, j.tin, j.api, 'blue');
    travel(t, P.down, j.api, j.q, 'blue');
    travel(t, P.up, j.d, j.run0, 'blue');
  }

  // --- the two lines under the picture ----------------------------------------
  const fade = prog(t, step.from, step.from + 0.4).toFixed(2);
  put(`<rect x="40" y="468" width="104" height="28" rx="14" fill="var(--blue)"/>`);
  text(92, 487, `Step ${n + 1} of ${STEPS.length}`, { size: 14, weight: 650, anchor: 'middle', fill: '#ffffff' });
  text(158, 489, step.title, { size: 21, weight: 650, fill: 'var(--ink)', opacity: fade });
  text(40, 517, step.sub, { size: 15, opacity: fade });
  const gap = 6, w = (960 - 80 - gap * (STEPS.length - 1)) / STEPS.length;
  STEPS.forEach((s, i) => {
    const x = 40 + i * (w + gap), done = i < n ? 1 : i === n ? prog(t, s.from, s.to) : 0;
    put(`<rect x="${x}" y="528" width="${w}" height="3" rx="1.5" fill="var(--faint)"/>`);
    if (done > 0) put(`<rect x="${x}" y="528" width="${(w * done).toFixed(1)}" height="3" rx="1.5" fill="var(--blue)"/>`);
  });

  document.getElementById('s').innerHTML = out.join('');
}
window.draw = draw;

if (q.has('step')) draw(STEPS[clamp(parseInt(q.get('step'), 10) - 1, 0, STEPS.length - 1)].still);
else if (q.has('t')) draw(parseFloat(q.get('t')));
else { const t0 = performance.now(); (function loop() { draw((performance.now() - t0) / 1000); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
