
# --- serverless-judge: throwaway, single-tenant, in-memory instance ---
listen_addresses = ''
unix_socket_directories = '/tmp'
max_connections = 20
shared_buffers = 32MB
dynamic_shared_memory_type = mmap
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0
autovacuum = off
io_method = sync
logging_collector = off
log_min_messages = warning
